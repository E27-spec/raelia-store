<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raelia Store</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#f8f6fc;
    margin:0;
    padding:20px;
}

.header{
    text-align:center;
    margin-bottom:30px;
}

.header h1{
    color:#6d28d9;
}

.product{
    background:white;
    max-width:400px;
    margin:auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.price{
    font-size:24px;
    font-weight:bold;
    color:#6d28d9;
}

.quantity{
    width:70px;
    padding:8px;
    margin-top:10px;
}

button{
    background:#6d28d9;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    margin-top:15px;
    width:100%;
}

#cart{
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
    <h1>Raelia Beauty</h1>
    <p>Luxury Hair & Beauty Collection</p>
</div>

<div class="product">
    <h2>Raelia Silk Serum</h2>

    <div class="price">$24.99</div>

    <p>Adds shine, softness, and helps reduce frizz.</p>

    <label>Quantity:</label><br>

    <input
        id="qty"
        class="quantity"
        type="number"
        value="1"
        min="1">

    <button onclick="addCart()">
        Add To Cart
    </button>

    <div id="cart">
        Cart: 0 item(s)
    </div>
</div>

<script>
let cart = 0;

function addCart(){
    let qty =
        parseInt(document.getElementById("qty").value);

    cart += qty;

    document.getElementById("cart").innerHTML =
        "Cart: " + cart + " item(s)";
}
</script>

</body>
</html>
