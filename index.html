<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raelia Store</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f7f3fb;
}

header{
    background:#7e22ce;
    color:white;
    text-align:center;
    padding:30px;
}

header h1{
    margin:0;
}

.cart-bar{
    background:white;
    padding:15px;
    position:sticky;
    top:0;
    font-weight:bold;
    box-shadow:0 2px 5px rgba(0,0,0,.1);
    z-index:10;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.product{
    background:white;
    border-radius:15px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.product-image{
    height:180px;
    background:linear-gradient(135deg,#e9d5ff,#c084fc);
    border-radius:12px;
    margin-bottom:15px;
}

.price{
    color:#7e22ce;
    font-size:24px;
    font-weight:bold;
}

input{
    width:70px;
    padding:8px;
    margin-top:10px;
}

button{
    width:100%;
    background:#7e22ce;
    color:white;
    border:none;
    padding:12px;
    border-radius:8px;
    margin-top:10px;
    cursor:pointer;
}

button:hover{
    background:#6b21a8;
}

.cart-summary{
    background:white;
    margin:20px;
    padding:20px;
    border-radius:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.checkout{
    background:#16a34a;
}

.checkout:hover{
    background:#15803d;
}
</style>

</head>
<body>

<header>
    <h1>Raelia Beauty
